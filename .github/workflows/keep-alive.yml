name: Keep API warm

# Render's free tier sleeps after 15 min without inbound traffic.
# GitHub's schedule can run several minutes late, so target ~8 min.
on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call public API route
        env:
          # Repo variable (Settings > Secrets and variables > Actions > Variables)
          # e.g. https://your-service.onrender.com
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL variable not set"; exit 1; fi
          # Cold start can take 30-60s; any HTTP response (even 404) means the server is awake.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 5 \
            "$API_URL/api/v1/legal/privacy" || true)
          echo "HTTP $code"
          case "$code" in
            2*|3*|4*) exit 0 ;;
            *) exit 1 ;;
          esac
